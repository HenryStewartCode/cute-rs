[package]
name = "cute-flashinfer"
version = "0.1.0"
edition = "2024"
description = "FlashInfer's LLM-serving kernels (attention, sampling, normalisation, RoPE, ...) ported to cute-rs."
license = "Apache-2.0"
repository = "https://github.com/HenryStewartCode/cute-rs"

[lib]
name = "flashinfer"
path = "src/lib.rs"

[features]
# Run the kernels on an NVIDIA GPU (cute-rs's CUDA driver binding).
cuda = ["cute-rs/cuda"]

[dependencies]
cute-rs = { path = ".." }

[package]
name = "cute-rs-cutedsl-check"
version = "0.1.0"
edition = "2024"
description = "Replays in cute-rs the calls recorded from NVIDIA's CuTe DSL by the scripts in reference/, and compares the answers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/HenryStewartCode/cute-rs"
publish = false

[dependencies]
cute-rs = { path = ".." }

[[bin]]
name = "cutedsl-check"
path = "src/main.rs"
